[package]
name = "whatsapp_trading_bot_desktop"
version = "1.0.0"
description = "WhatsApp MT5 XAUUSD Bot Tauri Desktop Application Shell"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
