[project]
name = "whatsapp-trading-bot"
version = "1.0.0"
description = "WhatsApp MT5 XAUUSD Trading Bot Core Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["apps/trading-service/tests"]
pythonpath = ["apps/trading-service"]

[tool.ruff]
line-length = 100
target-version = "py312"
